# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Kirkman's theorem on Steiner triple systems"
  description: >-
    A Lean 4 / Mathlib formalization of Kirkman's 1847 theorem: for v ≥ 1, a Steiner triple
    system on v points (a family of 3-subsets covering every pair of distinct points exactly
    once) exists if and only if v ≡ 1 or 3 (mod 6). Sufficiency is proved by Bose's and
    Skolem's constructions from Steiner quasigroups. Mathlib does not contain Steiner triple
    systems.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05B07"]

sources:
  - title: "On a problem in combinations"
    authors:
      - "T. P. Kirkman"
    type: "paper"
    location: "Cambridge and Dublin Mathematical Journal 2 (1847), 191–204"
    relationship: "formalizes"
    note: "Existence of Steiner triple systems for all v ≡ 1, 3 (mod 6)."
    license: "public domain"
    author_endorsement: "n/a"
  - title: "On the construction of balanced incomplete block designs"
    authors:
      - "R. C. Bose"
    id: "doi:10.1111/j.1469-1809.1939.tb02219.x"
    type: "paper"
    location: "Annals of Eugenics 9 (1939), 353–399"
    relationship: "background"
    note: "Bose's construction for v ≡ 3 (mod 6), used in the proof."
    license: "all rights reserved"
    author_endorsement: "n/a"
  - title: "Some remarks on the triple systems of Steiner"
    authors:
      - "Th. Skolem"
    id: "doi:10.7146/math.scand.a-10551"
    type: "paper"
    location: "Mathematica Scandinavica 6 (1958), 273–280"
    relationship: "background"
    note: "Skolem's construction for v ≡ 1 (mod 6), used in the proof."
    license: "all rights reserved"
    author_endorsement: "n/a"

status:
  scope: >-
    Both directions are proved for every v ≥ 1: the divisibility conditions are necessary, and
    explicit systems are constructed for every v ≡ 1, 3 (mod 6). Counting and classification of
    Steiner triple systems are not stated.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statements, the complete Lean proof (a double count, and Bose's and Skolem's constructions via Steiner quasigroups) and the Palomar
        packaging, checked with `lake build`, `#print axioms` and a comparison of the elaborated
        Challenge and Solution declarations (Lean v4.35.0-rc3, Mathlib
        c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean proof was written by the AI agent and is
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound,
    identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    Points are Fin v and the statement assumes v ≥ 1 (for v = 0 the empty family is a system
    although 0 ≢ 1, 3 (mod 6)). A system is a Finset of 3-element Finsets with every pair of
    distinct points in exactly one member.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statement with the classical theorem, checked the degenerate case v = 1 and the excluded case v = 0, and confirmed by `lake build`, `#print axioms` and a comparison of the fully
    elaborated Challenge and Solution declarations that the proofs use no `sorry` and only
    propext, Classical.choice and Quot.sound. The author directed the work and approved the
    statements. No independent human mathematical review has been performed. The result is
    classical; no mathematical novelty is claimed.

alignment:
  namespace: "KirkmanTheorem"
  statements:
    - source: "Kirkman (1847): a Steiner triple system of order v ≥ 1 exists iff v ≡ 1, 3 (mod 6)"
      lean: "KirkmanTheorem.kirkman"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community.
